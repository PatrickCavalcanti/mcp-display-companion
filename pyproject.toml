[project]
name = "mcp-display-companion"
version = "1.1.0"
description = "Ready-made wall panel for MCP Display: turn an old Android phone into a dashboard for your AI agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Patrick Cavalcanti" }]
keywords = ["mcp", "model-context-protocol", "wall-panel", "kiosk", "android", "home-assistant", "claude-code", "ai-agents", "dashboard"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Home Automation",
]
dependencies = []

[project.urls]
Homepage = "https://okapp.ai/app/mcp-display/"
Repository = "https://github.com/PatrickCavalcanti/mcp-display-companion"
Issues = "https://github.com/PatrickCavalcanti/mcp-display-companion/issues"

[project.optional-dependencies]
# Full Windows support: system media (GSMTC), Explorer via Shell COM, album cover
windows = [
  "winrt-runtime>=4.0",
  "winrt-Windows.Foundation>=4.0",
  "winrt-Windows.Foundation.Collections>=4.0",
  "winrt-Windows.Media.Control>=4.0",
  "winrt-Windows.Storage.Streams>=4.0",
  "pywin32>=308",
  "pillow>=10",
]
dev = ["pytest>=8"]

[project.scripts]
mcp-display-companion = "mcp_display_companion.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_display_companion"]

[tool.setuptools.package-data]
mcp_display_companion = ["templates/*.html"]
