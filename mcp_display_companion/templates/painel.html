<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
  --acc:{{ACCENT}};    /* destaque: preenchimento */
  --acc2:#b9afff;      /* destaque: icone e text sobre fundo escuro */
  --txt:#f4f5fb;       /* text principal */
  --mut:#a9aec4;       /* text secundario */
  --lin:rgba(255,255,255,.09);
  --bg:#080b10;
  --card:rgba(255,255,255,.04);
  --sombra:0 4px 16px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

body::before{content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;
  background:radial-gradient(40% 45% at 14% 6%, rgba(91,77,224,.20), transparent 70%),
             radial-gradient(34% 40% at 92% 96%, rgba(91,77,224,.12), transparent 70%);
  background:radial-gradient(40% 45% at 14% 6%, color-mix(in srgb, var(--acc) 30%, transparent), transparent 70%),
             radial-gradient(34% 40% at 92% 96%, color-mix(in srgb, var(--acc) 16%, transparent), transparent 70%);}
#app{position:relative;z-index:1;width:100vw;height:100vh;display:grid;grid-template-rows:1fr 44px;
  transform:translate(var(--dx,0),var(--dy,0));transition:transform .4s ease-out}

#janela{position:relative;overflow:hidden;min-height:0;touch-action:none}
/* the track has one lane per page: 1 (home only), 2 or 3 (with settings) */
#trilho{display:flex;width:calc(100% * var(--paginas,2));height:100%;will-change:transform}

.pagina{width:calc(100% / var(--paginas,2));height:100%;box-sizing:border-box;
  padding:16px 24px;display:grid;min-height:0;overflow:hidden}
/* a grid column is `auto` by default, so a card whose content is wider than
   its share of the screen pushes the track sideways instead of wrapping:
   `min-width:0` lets the columns shrink to the viewport */
.pagina>*{min-width:0;min-height:0}

/* PAGE 1 - the layout adapts to what exists: clock, weather, featured button */
#p1{grid-gap:16px;grid-template-columns:1.2fr 1fr;grid-template-rows:1.1fr 1fr;
  grid-template-areas:"relogio clima" "relogio botao"}
#p1.com-clima:not(.com-destaque){grid-template-rows:1fr;grid-template-areas:"relogio clima"}
#p1:not(.com-clima).com-destaque{grid-template-columns:1fr;grid-template-rows:1.2fr 1fr;grid-template-areas:"relogio" "botao"}
#p1:not(.com-clima):not(.com-destaque){grid-template-columns:1fr;grid-template-rows:1fr;grid-template-areas:"relogio"}
#p1:not(.com-relogio){grid-template-rows:1fr 1fr;grid-template-areas:"clima" "botao"}
#p1:not(.com-relogio):not(.com-clima){grid-template-rows:1fr;grid-template-areas:"botao"}

.relogio{grid-area:relogio;display:flex;flex-direction:column;justify-content:space-between;
  background:var(--card);border:1px solid var(--lin);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
/* the clock size is computed in JS to fill the card width */
#hora{font-size:80px;font-weight:600;line-height:1;letter-spacing:-.035em;white-space:nowrap}
.datas{padding-top:12px;border-top:1px solid var(--lin)}
#dia{font-size:clamp(16px,5vmin,22px);font-weight:600;margin-top:14px;color:var(--txt)}
#data{font-size:clamp(13px,3.8vmin,16px);color:var(--mut);margin-top:4px}

.card{grid-area:clima;display:flex;flex-direction:column;justify-content:center;
  background:var(--card);border:1px solid var(--lin);border-radius:24px;padding:20px 24px;box-shadow:var(--sombra)}
.topo{display:flex;align-items:center}
#icone{width:48px;height:48px;margin-right:16px;color:var(--acc2)}
#temp{font-size:clamp(36px,11vmin,48px);font-weight:600;line-height:1}
#cond{font-size:clamp(14px,4vmin,18px);font-weight:500;margin-top:6px;color:var(--txt)}
.meta{font-size:13px;color:var(--mut);margin-top:4px;display:flex;justify-content:space-between}

#p1>.featured{grid-area:botao}

/* BOTAO DE MIDIA EM DESTAQUE: CAPA LATERAL COM DEGRADE */
.btn-midia-banner{
  position:relative;overflow:hidden;display:flex;align-items:center;padding:10px 20px;
  background:linear-gradient(135deg, color-mix(in srgb, var(--acc) 35%, transparent), rgba(20,24,35,.85));
  border:1px solid rgba(185,175,255,.2);border-radius:22px;box-shadow:var(--sombra);
  cursor:pointer;outline:none;text-align:left;transition:transform .1s,filter .15s;
}
.btn-midia-banner:active{transform:scale(.98);filter:brightness(1.2)}
.btn-midia-banner .capa-banner{
  position:absolute;top:0;left:0;bottom:0;width:38%;z-index:1;
  background-size:cover;background-position:center;
  mask-image:linear-gradient(to right, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 100%);
  -webkit-mask-image:linear-gradient(to right, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 100%);
  display:none;opacity:0.92;
}
.btn-midia-banner.tem-capa .capa-banner{display:block}
.btn-midia-banner .ico-midia{
  width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;margin-right:16px;
  flex:0 0 auto;position:relative;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.35);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.btn-midia-banner .ico-midia svg{width:26px;height:26px;fill:#fff}
.btn-midia-banner .txt-midia{min-width:0;flex:1 1 auto;position:relative;z-index:2}
.btn-midia-banner #faixa{
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  font-size:17px;font-weight:700;letter-spacing:-.015em;color:#fff;line-height:1.2;
  overflow:hidden;
}
.btn-midia-banner #sub{
  display:block;font-size:13px;color:#dfe2f2;opacity:.85;margin-top:4px;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* PAGE 0: SLIDESHOW - the photo fills the whole screen, behind everything.
   The page itself is empty: the background shows only while it is the open page. */
#p0{padding:0}
.slide-fundo{position:fixed;inset:0;z-index:0;background:#000;
  opacity:0;transition:opacity .45s ease-out;pointer-events:none}
body.ver-slides .slide-fundo{opacity:1}
.slide-camada{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity .8s ease-in-out}
.slide-camada.visivel{opacity:1}
/* CLOCK OVER THE PHOTO: big and translucent, like glass on top of the image.
   Hidden unless the settings switch turns it on. */
#relogio-slide{position:absolute;left:0;bottom:0;padding:0 30px 64px;
  display:none;pointer-events:none}
body.relogio-imagens #relogio-slide{display:block}

/* véu no canto: devolve contraste local sem apagar a foto.
   A força vem da medição (--veu), então em foto bem escura ele quase some. */
#relogio-slide::before{
  /* área enxuta: só onde o relógio realmente escreve (menos pixel para o
     backdrop-filter desfocar a cada quadro do crossfade) */
  content:"";position:absolute;left:-4%;bottom:10%;width:64%;height:56%;
  /* sem z-index negativo: assim o vidro pinta DEPOIS das camadas da foto (é o
     que o backdrop-filter precisa desfocar) e ANTES do texto, que vem a seguir */
  pointer-events:none;
  /* o vidro: desfoca só o que está atrás do relógio, e a máscara dissolve a
     borda para não virar um retângulo */
  backdrop-filter:blur(6px) saturate(1.05);
  -webkit-backdrop-filter:blur(6px) saturate(1.05);
  -webkit-mask-image:radial-gradient(120% 120% at 0% 100%, #000 0%, #000 52%, transparent 88%);
  mask-image:radial-gradient(120% 120% at 0% 100%, #000 0%, #000 52%, transparent 88%);
  background:radial-gradient(120% 120% at 0% 100%,
    rgba(0,0,0,var(--veu,0)) 0%, rgba(0,0,0,0) 78%);
}
body.foto-clara #relogio-slide::before{
  background:radial-gradient(120% 120% at 0% 100%,
    rgba(255,255,255,var(--veu,0)) 0%, rgba(255,255,255,0) 78%);
}

/* tinta ESCURA é o padrão (foto clara); `foto-escura` inverte.
   O contorno (-webkit-text-stroke) é a "bordinha": define a borda do glifo
   mesmo quando o fundo é do meio-tom e a tinta é translúcida. */
#hora-slide{font-size:clamp(72px,30vh,170px);font-weight:600;line-height:.92;
  letter-spacing:-.045em;opacity:.62;color:#0b0d12;
  -webkit-text-stroke:.05em rgba(255,255,255,.8);paint-order:stroke fill;
  text-shadow:0 2px 22px rgba(255,255,255,.4)}
#data-slide{margin-top:10px;font-size:16px;font-weight:600;opacity:.72;
  letter-spacing:.01em;color:#0b0d12;
  -webkit-text-stroke:.07em rgba(255,255,255,.7);paint-order:stroke fill;
  text-shadow:0 1px 8px rgba(255,255,255,.35)}

body.foto-escura #hora-slide{color:#fff;opacity:.45;
  -webkit-text-stroke:.05em rgba(0,0,0,.7);
  text-shadow:0 2px 22px rgba(0,0,0,.5)}
body.foto-escura #data-slide{color:#fff;opacity:.6;
  -webkit-text-stroke:.07em rgba(0,0,0,.65);
  text-shadow:0 1px 8px rgba(0,0,0,.45)}
body.foto-escura #slide-progresso{background:rgba(0,0,0,.32)}
body.descanso #relogio-slide{display:none!important}

/* small ring in the corner: how long the current photo still has */
#slide-progresso{position:absolute;top:18px;right:20px;width:34px;height:34px;
  border-radius:50%;background:rgba(0,0,0,.28);
  display:flex;align-items:center;justify-content:center;opacity:.9}
#slide-progresso svg{width:26px;height:26px;transform:rotate(-90deg)}
#slide-progresso circle{fill:none;stroke-width:3.2;stroke-linecap:round}
.anel-trilha{stroke:rgba(255,255,255,.25)}
.anel-arco{stroke:#fff;stroke-dasharray:94.25;stroke-dashoffset:0}
#slide-legenda{position:absolute;left:0;right:0;bottom:0;padding:30px 24px 18px;
  font-size:15px;font-weight:600;color:#fff;letter-spacing:-.01em;
  background:linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,0));
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the footer sits on top of the photo: a gradient keeps the dots readable */
body.ver-slides #rodape{background:linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0))}
body.ver-slides #aviso{color:#f0f1f7}
body.descanso .slide-fundo{display:none!important}

/* PAGE 2: SHORTCUT GRID (as many as the configuration has) */
#p2{grid-template-columns:1fr;grid-template-rows:auto 1fr;grid-gap:10px}
#topo-p2{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
#titulo{font-size:15px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
#grid-atalhos{
  display:grid;grid-gap:12px;min-height:0;align-content:center;
  /* five fixed columns: ten shortcuts = 5 x 2, the layout that looks right */
  grid-template-columns:repeat(5,1fr);
  grid-auto-rows:minmax(96px,1fr);
}

.btn{box-sizing:border-box;min-height:50px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  background:var(--card);border:1px solid var(--lin);border-radius:20px;color:var(--txt);
  font:inherit;cursor:pointer;outline:none;box-shadow:var(--sombra);
  transition:background .15s,border-color .15s,transform .1s;padding:10px 8px;text-align:center}
.btn:active{transform:scale(.95);filter:brightness(1.25)}
.btn .ico{width:52px;height:52px;border-radius:16px;background:rgba(185,175,255,.12);color:var(--acc2);
  display:flex;align-items:center;justify-content:center;margin-bottom:8px;transition:background .15s}
.btn:active .ico{background:rgba(185,175,255,.24)}
.btn svg{width:30px;height:30px;fill:currentColor}
.btn .lbl{font-size:12px;font-weight:500;color:var(--mut);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

.btn.destaque{background:linear-gradient(180deg, color-mix(in srgb, var(--acc) 80%, #fff 0%), var(--acc));border-color:rgba(255,255,255,.18);color:#fff}
.btn.destaque .ico{background:rgba(255,255,255,.2);color:#fff}
.btn.destaque .lbl{color:rgba(255,255,255,.9)}
/* destaque sem capa: icone grande no centro da pagina 1 */
.btn.destaque.featured{padding:18px}
.btn.destaque.featured .ico{width:72px;height:72px;border-radius:22px}
.btn.destaque.featured svg{width:40px;height:40px}
.btn.destaque.featured .lbl{font-size:15px;font-weight:700;color:#fff}

.btn.espera, .btn-midia-banner.espera{box-shadow:0 0 0 2px #f0b429,var(--sombra)}
.btn.ok, .btn-midia-banner.ok{background:#14532d;border-color:#2f9e5c}
.btn.erro, .btn-midia-banner.erro{background:#7a1f2b;border-color:#e0555f}

/* PAGE 3: HOME CONTROL (Escritorio). Cards 2 x 1; the top-right 48 px corner stays free
   because the title sits on the left and the cards start below it. */
.pagina-casa{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-gap:8px}
#topo-casa{display:flex;align-items:center;height:24px;padding:0 4px}
#titulo-casa{font-size:15px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
#casa-cartoes{display:grid;grid-template-columns:1.25fr 1fr;grid-gap:14px;min-height:0}
.casa-card{display:flex;flex-direction:column;gap:8px;min-height:0;
  background:var(--card);border:1px solid var(--lin);border-radius:24px;padding:14px 16px;box-shadow:var(--sombra);
  transition:opacity .2s}
.casa-cab{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--mut);flex:0 0 auto}
.casa-cab svg{width:20px;height:20px;fill:currentColor;color:var(--acc2)}
.casa-card button{font:inherit;color:var(--txt);cursor:pointer;outline:none;
  transition:background .15s,border-color .15s,transform .1s}
.casa-card button:active{transform:scale(.96);filter:brightness(1.2)}
.casa-card svg{fill:currentColor}
.casa-power,.casa-luz-btn{display:flex;align-items:center;justify-content:center;gap:12px;
  background:rgba(255,255,255,.07);border:1px solid var(--lin);border-radius:18px;font-size:18px;font-weight:700}
.casa-power{flex:0 0 auto;min-height:52px}
.casa-power svg{width:26px;height:26px}
.casa-power.on,.casa-luz-btn.on{background:var(--acc);border-color:transparent;color:#fff}
.casa-temp{flex:1 1 auto;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.casa-passo{flex:0 0 auto;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.07);border:1px solid var(--lin)}
.casa-passo:disabled{opacity:.35}
.casa-passo svg{width:28px;height:28px}
#ar-alvo{font-size:52px;font-weight:600;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.casa-sala{flex:0 0 auto;font-size:13px;color:var(--mut);text-align:center;min-height:16px}
.casa-luz-btn{flex:1 1 auto;flex-direction:column;gap:6px;min-height:96px;font-size:20px}
.casa-luz-btn svg{width:64px;height:64px}
#casa-status{font-size:12px;color:var(--mut);padding:0 4px;min-height:16px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#casa-status.erro{color:#f87171}
#casa-status.espera{color:#fbbf24}
.pagina-casa.indisp .casa-card{opacity:.55}

/* SETTINGS (p3, or p4 when the home page exists; style by class) */
.pagina-ajustes{grid-template-columns:1fr;grid-template-rows:auto 1fr;grid-gap:10px}
#topo-p3,#topo-p4{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
#titulo3,#titulo4{font-size:15px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
#config-lista{display:grid;align-content:center;grid-auto-rows:max-content;grid-gap:14px;min-height:0}

/* a big switch: the screen is used from a distance, with a finger */
.config-item{
  display:flex;align-items:center;gap:26px;width:100%;min-height:132px;
  background:var(--card);border:1px solid var(--lin);border-radius:24px;
  padding:20px 26px;color:var(--txt);font:inherit;cursor:pointer;outline:none;
  box-shadow:var(--sombra);text-align:left;transition:background .15s,transform .1s;
}
.config-item:active{transform:scale(.99);filter:brightness(1.15)}
.config-item .cfg-txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.config-item .cfg-txt b{font-size:24px;font-weight:700;letter-spacing:-.01em}
.config-item .cfg-txt small{font-size:14px;color:var(--mut);line-height:1.35}
.switch{
  flex:0 0 auto;width:112px;height:62px;border-radius:31px;position:relative;
  background:rgba(255,255,255,.12);border:1px solid var(--lin);transition:background .2s;
}
.switch i{
  position:absolute;top:6px;left:6px;width:48px;height:48px;border-radius:50%;
  background:#8b90a8;transition:transform .2s,background .2s;
}
.switch.on{background:var(--acc);border-color:transparent}
.switch.on i{transform:translateX(50px);background:#fff}

/* REST MODE: the same home screen, black background, white text, no cover.
   The point is to spend as little battery as possible; any touch wakes it. */
#despertar{position:fixed;inset:0;z-index:50;display:none;background:transparent}
body.descanso #despertar{display:block;pointer-events:auto}  /* #app desliga os eventos: a camada que acorda precisa religar */
body.descanso #app{pointer-events:none}
body.descanso{--bg:#000;--card:#000;--lin:rgba(255,255,255,.22);--sombra:none;
  --txt:#fff;--mut:#fff;--acc:#fff;--acc2:#fff}
body.descanso::before{display:none}
body.descanso *{box-shadow:none!important}
body.descanso .capa-banner{display:none!important}
body.descanso .ico-midia,
body.descanso .btn .ico,
body.descanso .switch{background:transparent!important;border-color:rgba(255,255,255,.4)!important}
body.descanso .btn-midia-banner,
body.descanso .btn.destaque,
body.descanso .relogio,
body.descanso .card{background:#000!important;border-color:rgba(255,255,255,.22)!important}
body.descanso #hora,body.descanso #dia,body.descanso #temp,body.descanso #cond,
body.descanso #cidade,body.descanso #data,body.descanso #atual,body.descanso #faixa,
body.descanso #sub,body.descanso .rot-pp,body.descanso .lbl,body.descanso #aviso,
body.descanso #estado{color:#fff!important}
body.descanso #estado i{background:#fff!important}
body.descanso .ponto i{background:rgba(255,255,255,.45)!important}
body.descanso .ponto.on i{background:#fff!important}
body.descanso .icone{color:#fff!important}

/* FOOTER */
#rodape{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:0 24px}
#aviso{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#aviso.ok{color:#4ade80}
#aviso.erro{color:#f87171}
#aviso.espera{color:#fbbf24}
#estado{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:12px;color:var(--mut)}
#estado i{display:block;width:8px;height:8px;border-radius:50%;background:#4ade80;transition:background .2s}
#estado.off{color:#f87171}
#estado.off i{background:#f87171}
#pontos{display:flex;gap:8px;justify-content:center}
.ponto{width:28px;height:28px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ponto i{display:block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .2s,width .2s}
.ponto.on i{background:var(--acc2);width:22px;border-radius:4px}
.uma-pagina #pontos{display:none}

/* ------------------------------------------------------------------
   PÉ (portrait): the same screen, rearranged as a column.
   The design is drawn for the panel lying on its side (692x360); held
   upright the two columns squeeze into 360 px and every card overflows.
   Here each page becomes a single column, the shortcut grid turns into
   two wide columns, and the switches shrink so the label keeps its line.
   Landscape keeps the rules above untouched.
   ------------------------------------------------------------------ */
@media (orientation:portrait){
  .pagina{padding:14px 16px;grid-gap:12px}

  /* PAGE 1: clock on top (it is the hero), weather, then the featured button */
  #p1{grid-template-columns:1fr;grid-template-rows:1.9fr .95fr 1fr;
    grid-template-areas:"relogio" "clima" "botao"}
  #p1.com-clima:not(.com-destaque){grid-template-rows:2.4fr 1fr;grid-template-areas:"relogio" "clima"}
  #p1:not(.com-clima).com-destaque{grid-template-rows:2.1fr 1fr;grid-template-areas:"relogio" "botao"}
  #p1:not(.com-clima):not(.com-destaque){grid-template-rows:1fr;grid-template-areas:"relogio"}
  #p1:not(.com-relogio){grid-template-rows:1fr 1fr;grid-template-areas:"clima" "botao"}
  #p1:not(.com-relogio):not(.com-clima){grid-template-rows:1fr;grid-template-areas:"botao"}
  .relogio{padding:20px 22px;border-radius:20px}
  .card{padding:16px 18px;border-radius:20px}
  #icone{width:40px;height:40px;margin-right:12px}
  #temp{font-size:clamp(32px,9vmin,44px)}
  .btn-midia-banner{padding:12px 18px;border-radius:18px}

<script>
var DESLOCA_PX = 6;
var ESPERA_CONFIRMACAO_MS = 6000;   /* tolerancia para o PC confirmar o toque */
var LIMITE_SILENCIO_MS = 150000;    /* sem sinal do PC por 150 s = offline */
var TAPS_POR_10S = 8;

/* ---------------- ponte com o painel (MCP App) ---------------- */
var seq = 0, pend = {}, pronto = false;
function req(m, p) {
  return new Promise(function (ok) {
    var id = ++seq; pend[id] = ok;
    parent.postMessage({jsonrpc: '2.0', id: id, method: m, params: p}, '*');
  });
}
function nota(m, p) { parent.postMessage({jsonrpc: '2.0', method: m, params: p}, '*'); }

window.addEventListener('message', function (e) {
  var d = e.data;
  if (e.source !== parent || !d || d.jsonrpc !== '2.0') return;
  if (d.method) {
    if (d.id !== undefined) parent.postMessage({jsonrpc: '2.0', id: d.id, result: {}}, '*');
    if (d.method === 'ui/notifications/tool-result' && d.params) {
      sinalDoPC();
      aplicar(d.params.structuredContent);
    }
    return;
  }
  if (d.id === undefined) return;
  var f = pend[d.id];
  if (f) { delete pend[d.id]; f(d); }
});

/* Sign of life from the PC: the companion sends 'vivo' on every heartbeat. */
var ultimoSinal = Date.now();
function sinalDoPC() { ultimoSinal = Date.now(); estadoPC(); }
function pcOffline() { return Date.now() - ultimoSinal > LIMITE_SILENCIO_MS; }
function estadoPC() {
  var off = pcOffline();
  var e = el('estado');
  if (!e) return;
  e.classList.toggle('off', off);
  el('estado-txt').textContent = off ? 'PC offline' : 'PC';
}
setInterval(estadoPC, 5000);

req('ui/initialize', {appInfo: {name: 'painel-companion', version: '2'}, appCapabilities: {}, protocolVersion: '2026-01-26'})
  .then(function (r) {
    if (r.error) { aviso('falha no handshake', 'erro'); return; }
    nota('ui/notifications/initialized', {});
    pronto = true;
    sinalDoPC();
    casaIniciar();
    aviso('pronto', '');
  });

/* ---------------- utilidades ---------------- */
function el(id) { return document.getElementById(id); }
function todos(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
function dois(n) { return (n < 10 ? '0' : '') + n; }
var avisoTimer = 0;
function aviso(text, cls) {
  var a = el('aviso'); if (!a) return;
  a.textContent = text; a.className = cls || '';
  clearTimeout(avisoTimer);
  if (cls === 'ok' || cls === 'erro') avisoTimer = setTimeout(function () { aviso('pronto', ''); }, 2500);
}

/* ---------------- relogio ---------------- */
var DIAS = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
function relogio() {
  var t = new Date();
  var hora = dois(t.getHours()) + ':' + dois(t.getMinutes());
  var textoData = t.getDate() + ' de ' + MESES[t.getMonth()] + ' de ' + t.getFullYear();
  var h = el('hora');
  if (h) {
    h.textContent = hora;
    el('dia').textContent = DIAS[t.getDay()];
    el('data').textContent = textoData;
  }
  // a hora grande sobre a foto
  var hs = el('hora-slide');
  if (hs) {
    hs.textContent = hora;
    el('data-slide').textContent = DIAS[t.getDay()] + ' · ' + textoData;
  }
}
/* The clock is the most useful information on screen: it takes the widest
   size that fits the card. Measured with the real font (canvas), not guessed. */
function fitClock() {
  var h = el('hora'), card = document.querySelector('.relogio');
  if (!h || !card) return;
  var estilo = getComputedStyle(h), cardEstilo = getComputedStyle(card);
  var disponivel = card.clientWidth
    - parseFloat(cardEstilo.paddingLeft) - parseFloat(cardEstilo.paddingRight);
  var text = h.textContent || '00:00';
  var ctx = fitClock.ctx || (fitClock.ctx = document.createElement('canvas').getContext('2d'));
  var fonte = estilo.fontWeight + ' ' + '100px ' + estilo.fontFamily;
  function largura(px) {
    ctx.font = fonte.replace('100px', px + 'px');
    return ctx.measureText(text).width * (1 + parseFloat(estilo.letterSpacing || 0) / px);
  }
  var baixo = 20, alto = 400;
  for (var i = 0; i < 20; i++) {
    var meio = (baixo + alto) / 2;
    if (largura(meio) <= disponivel * 0.99) baixo = meio; else alto = meio;
  }
  h.style.fontSize = Math.floor(baixo) + 'px';
}

relogio();
fitClock();
setInterval(function () { relogio(); fitClock(); }, 1000);

/* ---------------- dados que o PC manda ---------------- */
function aplicar(d) {
  if (!d || typeof d !== 'object') return;
  if (d.slide) showSlide(d.slide);
  if (d.clima) clima(d.clima);
  if (d.midia) midia(d.midia);
  if (d.rest) applyRest(d.rest);
  if (d.photo_clock) applyPhotoClock(d.photo_clock);
  if (d.confirmacao) confirmou(d.confirmacao);
  if (Array.isArray(d.alertas)) aplicarAlertas(d.alertas, d.allow_approve !== false);
}

/* two alternating layers: the incoming one fades in on top */
var currentLayer = null;
/* A tinta do relógio vem da própria foto.
   A imagem é desenhada num canvas no formato da tela (recorte igual ao `cover`
   do CSS) e duas faixas são medidas: a da hora e a da data. Para cada faixa,
   escolhe-se a tinta de maior contraste e calcula-se o véu que falta.
   Data URL é da mesma origem: ler os pixels não contamina o canvas. */
var medidaFoto = document.createElement('canvas');
function luminanciaDaFaixa(dados, largura, deY, ateY, ateX) {
  var soma = 0, n = 0;
  for (var y = Math.round(deY); y < Math.round(ateY); y++) {
    for (var x = 0; x < Math.round(ateX); x++) {
      var i = (y * largura + x) * 4;
      soma += 0.2126 * dados[i] + 0.7152 * dados[i + 1] + 0.0722 * dados[i + 2];
      n++;
    }
  }
  return n ? soma / n : 128;
}

function medirFundo(src) {
  var img = new Image();
  img.onload = function () {
    try {
      var L = 96, A = 50;                      /* 96x50 ≈ 692x360, o formato da tela */
      medidaFoto.width = L; medidaFoto.height = A;
      var ctx = medidaFoto.getContext('2d', {willReadFrequently: true});
      /* mesmo recorte do background-size: cover */
      var escala = Math.max(L / img.width, A / img.height);
      var largura = img.width * escala, altura = img.height * escala;
      ctx.drawImage(img, (L - largura) / 2, (A - altura) / 2, largura, altura);
      var dados = ctx.getImageData(0, 0, L, A).data;

      var hora = luminanciaDaFaixa(dados, L, A * 0.45, A * 0.75, L * 0.55);
      var data = luminanciaDaFaixa(dados, L, A * 0.78, A * 0.95, L * 0.55);

      /* o branco tem muito mais brilho que o preto tem escuridão: o ponto em que
         as duas tintas empatam em contraste fica perto de 70, não de 128 */
      document.body.classList.toggle('foto-escura', hora < 72);

      /* véu: máximo no meio-tom (onde nenhuma tinta resolve), quase zero nos extremos */
      var contraste = Math.abs(hora - 128) / 128;          /* 0 = cinza, 1 = extremo */
      var veu = Math.max(0, Math.min(0.42, 0.42 - contraste * 0.34));
      /* a data é menor: sofre mais, então pede um pouco mais de véu */
      var contrasteData = Math.abs(data - 128) / 128;
      veu = Math.max(veu, Math.max(0, Math.min(0.30, 0.30 - contrasteData * 0.24)));
      document.body.style.setProperty('--veu', veu.toFixed(2));
    } catch (e) { /* WebView sem canvas: fica na tinta escura, que é a mais segura */ }
  };
  img.src = src;
}

var ringAnimation = null;
function countNextPhoto(seconds) {
  var arco = el('anel-arco');
  if (!arco || !arco.animate) return;      /* old WebView: no ring at all */
  if (ringAnimation) ringAnimation.cancel();
  var volta = 2 * Math.PI * 15;            /* ring circumference (r=15) */
  arco.style.strokeDasharray = volta;
  if (!seconds || seconds <= 0) { arco.style.strokeDashoffset = 0; return; }
  /* the ring empties at the same pace the next photo will arrive */
  ringAnimation = arco.animate(
    [{ strokeDashoffset: 0 }, { strokeDashoffset: volta }],
    { duration: seconds * 1000, easing: 'linear', fill: 'forwards' }
  );
}

function showSlide(slide) {
  if (!slide || typeof slide.src !== 'string') return;
  countNextPhoto(slide.interval);
  var proxima = (currentLayer === el('slide-a')) ? el('slide-b') : el('slide-a');
  var anterior = (proxima === el('slide-a')) ? el('slide-b') : el('slide-a');
  if (!proxima) return;
  proxima.style.backgroundImage = 'url(' + slide.src + ')';
  proxima.classList.add('visivel');
  if (anterior) anterior.classList.remove('visivel');
  currentLayer = proxima;
  var legenda = el('slide-legenda');
  if (legenda) legenda.textContent = slide.caption || '';
  medirFundo(slide.src);
}

function iconeClima(c) {
  var s = String(c || '').toLowerCase();
  if (/chuv|garo|temporal|pancada|tempest|trovo/.test(s)) return '#i-chuva';
  if (/parcial|variav|poucas|entre nuvens/.test(s)) return '#i-parcial';
  if (/nubl|nuvem|nuvens|encoberto|cinz|neblin|nevoe/.test(s)) return '#i-nuvem';
  if (/sol|limpo|claro|ensolarado/.test(s)) return '#i-sol';
  return '#i-parcial';
}

function clima(c) {
  if (typeof c !== 'object' || !el('temp')) return;
  var t = c.temp;
  el('temp').textContent = (typeof t === 'number') ? Math.round(t) + '°' : (t === undefined ? '--' : String(t));
  el('cond').textContent = c.condicao === undefined ? '' : String(c.condicao);
  el('cidade').textContent = c.cidade === undefined ? '' : String(c.cidade);
  el('icone').firstChild.setAttribute('href', iconeClima(c.condicao));
  var n = new Date();
  el('atual').textContent = 'atualizado ' + dois(n.getHours()) + ':' + dois(n.getMinutes());
}

function midia(m) {
  if (!m || typeof m !== 'object') return;
  var tocando = m.tocando === true;
  todos('.ic-pp use').forEach(function (u) { u.setAttribute('href', tocando ? '#i-pause' : '#i-play'); });
  todos('.rot-pp').forEach(function (s) {
    if (m.titulo) s.textContent = (tocando ? '▶ ' : '⏸ ') + (tocando ? 'Tocando' : 'Pausado');
    else s.textContent = tocando ? 'Pausar' : 'Tocar';
  });

  var faixa = el('faixa');
  if (faixa) faixa.textContent = m.titulo || 'Mídia no computador';
  var sub = el('sub');
  if (sub) {
    var estado = tocando ? 'tocando' : 'pausado';
    sub.textContent = m.titulo ? (m.artista ? m.artista + ' · ' + estado : estado) : 'aguardando o player';
  }

  var bannerBtn = document.querySelector('.btn-midia-banner');
  var bannerCapa = el('banner-capa');
  if (bannerBtn && bannerCapa) {
    if (m.capa) {
      bannerCapa.style.backgroundImage = 'url(' + m.capa + ')';
      bannerBtn.classList.add('tem-capa');
    } else {
      bannerCapa.style.backgroundImage = 'none';
      bannerBtn.classList.remove('tem-capa');
    }
  }
}

/* ---------------- toques ---------------- */
var espera = {}, envios = [];
function marcar(acao, cls) {
  todos('.btn-clicavel').forEach(function (b) {
    if (b.getAttribute('data-acao') !== acao) return;
    b.classList.remove('espera', 'ok', 'erro');
    if (cls) b.classList.add(cls);
    if (cls === 'ok' || cls === 'erro') setTimeout(function () { b.classList.remove(cls); }, 900);
  });
}
function rotulo(acao) {
  var b = document.querySelector('.btn-clicavel[data-acao="' + acao + '"]');
  return b ? b.getAttribute('data-rotulo') : acao;
}
function limite() {
  var agora = Date.now();

      ? 'Role o texto até o fim para liberar Aprovar'
      : 'Texto longo/oculto — aprove no PC';
  }
  if (!alertaNotaTimer) { var av = el('alerta-aviso'); if (av) av.textContent = msg; }
}
function alertaNota(texto) {
  var av = el('alerta-aviso');
  if (!av) return;
  av.textContent = texto;
  clearTimeout(alertaNotaTimer);
  alertaNotaTimer = setTimeout(function () { alertaNotaTimer = 0; alertaAtualizarAprovar(); }, 2500);
}
function aplicarAlertas(lista, podeAprovar) {
  alertasUltima = lista;
  if (typeof podeAprovar === 'boolean') alertaPodeAprovar = podeAprovar;
  var vigentes = {}, visiveis = [], k;
  lista.forEach(function (a) {
    if (!a || typeof a !== 'object' || typeof a.id !== 'string') return;
    var ch = alertaChave(a);
    vigentes[ch] = 1;
    if (!alertasDispensados[ch]) visiveis.push(a);
  });
  for (k in alertasDispensados) if (!vigentes[k]) delete alertasDispensados[k];
  var nova = visiveis.some(function (a) { return !alertasVistos[alertaChave(a)]; });
  alertasVistos = vigentes;
  var banner = el('alerta');
  if (!banner) return;
  if (!visiveis.length) {
    alertaAtual = null;
    alertaCancelarSegurar();
    if (Date.now() < alertaEnviadoAte) return;   /* keep the "enviado" notice for a moment */
    if (document.body.classList.contains('alerta-on')) lastActivity = Date.now();   /* no instant rest */
    document.body.classList.remove('alerta-on');
    return;
  }
  var a = visiveis[visiveis.length - 1];
  var mudou = !alertaAtual || alertaAssinatura(alertaAtual) !== alertaAssinatura(a);
  if (mudou) { alertaCancelarSegurar(); alertaLido = false; }
  alertaAtual = a;
  var acionavel = a.actionable === true && !!a.request && typeof a.request === 'object';
  banner.classList.remove('enviado');
  banner.classList.toggle('acionavel', acionavel);
  banner.classList.toggle('semaprovar', !alertaPodeAprovar);
  var projeto = String(a.project || '').slice(0, 60) || 'Claude';
  el('alerta-t1').textContent = projeto + ' pede permissão';
  el('alerta-tool').textContent = acionavel ? String(a.request.tool || '').slice(0, 140) : '';
  var t2 = el('alerta-t2');
  t2.classList.toggle('mono', acionavel);
  t2.textContent = acionavel ? String(a.request.summary || '').slice(0, 1200) : String(a.message || '').slice(0, 200);
  if (mudou) t2.scrollTop = 0;
  el('alerta-mais').textContent = visiveis.length > 1 ? '+' + (visiveis.length - 1) : '';
  document.body.classList.add('alerta-on');
  alertaAtualizarAprovar();   /* after the banner is laid out: it measures the text box */
  wakeUp();                   /* a banner on a dark screen would not be seen */
  if (nova) lastActivity = Date.now();
}
function dispensarAlerta() {
  var a = alertaAtual;
  if (!a) return;
  alertaCancelarSegurar();
  alertasDispensados[alertaChave(a)] = 1;
  alertaAtual = null;
  lastActivity = Date.now();
  document.body.classList.remove('alerta-on');
  /* straight to the PC: no 'sending' notice and no PC-offline error on a button */
  if (pronto) req('tools/call', {name: 'pc_alerta_dispensar', arguments: {id: a.id}});
  /* an older alert, if any, shows right after the PC answers with the new list */
}
/* `a` is the alert the person acted on; it must still be the one on screen */
function responderAlerta(a, decisao) {
  if (!a || a.actionable !== true || (decisao !== 'allow' && decisao !== 'deny')) return;
  if (!alertaAtual || alertaChave(alertaAtual) !== alertaChave(a)) return;
  if (decisao === 'allow' && !alertaPodeAprovarEste(a)) return;
  if (typeof a.nonce !== 'string' || !a.nonce) { alertaNota('Sem chave de resposta — responda no PC'); return; }
  if (!pronto) { alertaNota('Sem conexão com o PC — nada foi enviado'); aviso('conectando', 'espera'); return; }
  if (limite()) { alertaNota('Muitos toques, aguarde'); aviso('muitos toques, aguarde', 'erro'); return; }
  alertaCancelarSegurar();
  alertasDispensados[alertaChave(a)] = 1;
  alertaAtual = null;
  req('tools/call', {name: 'pc_alerta_responder', arguments: {id: a.id, decisao: decisao, nonce: a.nonce}});
  var banner = el('alerta');
  banner.classList.add('enviado');
  el('alerta-t1').textContent = 'enviado…';
  el('alerta-mais').textContent = '';
  alertaEnviadoAte = Date.now() + 1200;
  setTimeout(function () { alertaEnviadoAte = 0; aplicarAlertas(alertasUltima); }, 1250);
}
(function () {
  var b = el('alerta');
  if (!b) return;
  b.addEventListener('click', function (e) {
    e.stopPropagation();
    if (alertaAtual && alertaAtual.actionable !== true) dispensarAlerta();
  });
  var x = el('alerta-x'), negar = el('alerta-negar'), ap = el('alerta-aprovar'), t2 = el('alerta-t2');
  if (x) x.addEventListener('click', function (e) { e.stopPropagation(); dispensarAlerta(); });
  if (t2) t2.addEventListener('scroll', function () {
    if (alertaAtual && t2.scrollTop + t2.clientHeight >= t2.scrollHeight - 3 && !alertaLido) {
      alertaLido = true;
      alertaAtualizarAprovar();
    }
  });
  window.addEventListener('resize', function () { if (alertaAtual) alertaAtualizarAprovar(); });
  if (negar) {
    var negarAlvo = null;   /* the alert on screen when the finger went down */
    negar.addEventListener('pointerdown', function (e) { e.stopPropagation(); negarAlvo = alertaAtual; });
    ['pointercancel', 'pointerleave'].forEach(function (n) { negar.addEventListener(n, function () { negarAlvo = null; }); });
    negar.addEventListener('click', function (e) {
      e.stopPropagation();
      var alvo = negarAlvo || alertaAtual;
      negarAlvo = null;
      responderAlerta(alvo, 'deny');
    });
  }
  if (!ap) return;
  var x0 = 0, y0 = 0;
  ap.addEventListener('pointerdown', function (e) {
    e.stopPropagation();
    var alvo = alertaAtual;
    if (alertaSegura.timer || !alertaPodeAprovarEste(alvo)) return;
    var chave = alertaAssinatura(alvo);   /* captured now: the timer approves only this alert */
    x0 = e.clientX; y0 = e.clientY;
    try { ap.setPointerCapture(e.pointerId); } catch (err) {}
    ap.classList.add('segurando');
    alertaSegura = {chave: chave, timer: setTimeout(function () {
      alertaSegura = {chave: '', timer: 0};
      ap.classList.remove('segurando');
      var agora = alertaAtual;
      if (!agora || alertaAssinatura(agora) !== chave || !alertaPodeAprovarEste(agora)) return;
      responderAlerta(agora, 'allow');
    }, ALERTA_SEGURAR_MS)};
  });
  ap.addEventListener('pointermove', function (e) {
    if (alertaSegura.timer && Math.max(Math.abs(e.clientX - x0), Math.abs(e.clientY - y0)) > ALERTA_MOVE_PX) alertaCancelarSegurar();
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (n) { ap.addEventListener(n, alertaCancelarSegurar); });
  ap.addEventListener('click', function (e) { e.stopPropagation(); });
  ap.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
/* visual check from a console, e.g. an actionable alert:
   simularAlertas([{id:'x-1',project:'demo',message:'Claude quer usar Bash',at:Date.now()/1000,actionable:true,request:{tool:'Bash',summary:'rm -rf build && npm run build',truncated:false},nonce:'demo'}], true) */
window.simularAlertas = function (lista, podeAprovar) { aplicarAlertas(Array.isArray(lista) ? lista : [], podeAprovar === false ? false : true); };

(function () {
  var wakeOverlay = el('despertar');
  if (wakeOverlay) wakeOverlay.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    e.stopPropagation();
    wakeUp();
  });
  window.addEventListener('pointerdown', function () { lastActivity = Date.now(); }, true);
  window.addEventListener('pointermove', function () { lastActivity = Date.now(); }, true);
  window.addEventListener('keydown', function () { lastActivity = Date.now(); }, true);
  setInterval(restWatcher, 1000);
  refreshRestSwitch();
})();
</script>
